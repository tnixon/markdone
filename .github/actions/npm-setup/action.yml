name: npm setup
description: Set up Node from .nvmrc with an npm cache, then install workspace deps.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci
      shell: bash
