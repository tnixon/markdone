name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    # Optional: Skip review for specific PR tags
    # Fork PRs and Dependabot's get no secrets, so the review would only fail;
    # skip them.
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.title, '[WIP]')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (not just the PR's single commit) so the plugin's
          # git-blame/git-log steps have something to work with.
          fetch-depth: 0

      # The prompt comes from the base branch, so a pull request cannot rewrite
      # its own reviewer. Only fixed-format values go in the header; the title
      # and body are untrusted and are left out.
      - name: Build the prompt from the base branch
        id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "text<<$delimiter"
            echo "REPO: $REPO"
            echo "PR NUMBER: $PR_NUMBER"
            echo "BASE SHA: $BASE_SHA"
            echo "HEAD SHA: $HEAD_SHA"
            echo "REVIEWER: Claude"
            echo
            git show "$BASE_SHA:.github/prompts/code-review.md"
            git show "$BASE_SHA:.github/prompts/code-review.claude.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@469588f42e6b1e94cd14ad09dccfeaec772ce0fd # v1.0.280
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Enable progress tracking
          track_progress: true

          # Shared with the Codex review: .github/prompts/
          prompt: ${{ steps.prompt.outputs.text }}

          # Tools for comprehensive PR review
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*)"

# When track_progress is enabled:
# - Creates a tracking comment with progress checkboxes
# - Includes all PR context (comments, attachments, images)
# - Updates progress as the review proceeds
# - Marks as completed when done